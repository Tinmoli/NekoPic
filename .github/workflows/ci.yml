name: CI

on: [push, pull_request]

permissions:
  contents: read

env:
  GO_VERSION: '1.27.1'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o bin/nekopic ./app
      - if: runner.os == 'Linux'
        run: go test -race ./...

  build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: arm, goarm: '7' }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SUFFIX="${{ matrix.goos == 'windows' && '.exe' || '' }}"
          NAME="nekopic-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm == '7' && 'v7' || '' }}${SUFFIX}"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$NAME" ./app
      - uses: actions/upload-artifact@v4
        with:
          name: nekopic-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm == '7' && '-v7' || '' }}
          path: nekopic-*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums and release
        run: |
          sha256sum nekopic-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md --generate-notes nekopic-* SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
